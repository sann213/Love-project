<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MI AMOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010405;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .glass-panel {
            backdrop-filter: blur(16px);
            background: rgba(255, 20, 147, 0.05);
            border: 1px solid rgba(255, 105, 180, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #ff69b4;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
        }
    </style>
</head>
<body>

    <div class="absolute top-10 left-10 z-10 text-white pointer-events-none select-none">
        <h1 class="text-2xl font-bold tracking-tighter text-pink-500 drop-shadow-2xl">Hello My World</h1>
        <p class="text-[6px] opacity-40 mt-1 uppercase tracking-[0.3em]">this is for you</p>
    </div>

    <div class="glass-panel absolute bottom-10 left-1/2 -translate-x-1/2 px-8 py-4 rounded-3xl flex flex-wrap justify-center gap-8 items-center text-white text-[9px] uppercase tracking-[0.2em] z-20 w-[90%] max-w-md md:max-w-none md:w-auto">
        <div class="flex flex-col gap-2">
            <label class="opacity-60">Ukuran Hati</label>
            <input id="scaleInput" type="range" min="5" max="25" value="13" class="w-28 cursor-pointer">
        </div>
        <div class="flex flex-col gap-2">
            <label class="opacity-60">Detak Jantung</label>
            <input id="speedInput" type="range" min="1" max="100" value="30" class="w-28 cursor-pointer">
        </div>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");
        const scaleInput = document.getElementById("scaleInput");
        const speedInput = document.getElementById("speedInput");

        let pulse = 0;
        let colorOffset = 0;
        const NUM_PARTICLES = 80; 
        const MESSAGE = "I love you";

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function getHeartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function getHeartY(t) {
            return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        }

        function animate() {
            ctx.fillStyle = "rgba(5, 1, 3, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            const baseScale = parseFloat(scaleInput.value) || 13;
            const speed = (parseFloat(speedInput.value) || 30) / 1000;

            pulse += speed;
            colorOffset += 1;

            const pulseAmount = Math.sin(pulse * 5) * 1.5;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let i = 0; i < NUM_PARTICLES; i++) {
                const t = (i / NUM_PARTICLES) * Math.PI * 2;
                
                const x = getHeartX(t) * (baseScale + pulseAmount);
                const y = getHeartY(t) * (baseScale + pulseAmount);

                const hue = 330 + (Math.sin(colorOffset * 0.02 + i * 0.1) * 15);
                const lightness = 60 + (Math.sin(pulse * 2 + i * 0.2) * 10);
                
                ctx.fillStyle = "hsla(" + hue + ", 100%, " + lightness + "%, 0.8)";
                ctx.font = "bold " + (10 + (pulseAmount * 0.3)) + "px 'Inter', sans-serif";

                ctx.shadowBlur = 8;
                ctx.shadowColor = "hsla(" + hue + ", 100%, 60%, 0.4)";

                ctx.fillText(MESSAGE, cx + x, cy + y);
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        
        window.onload = () => {
            resize();
            animate();
        };

        if (document.readyState === 'complete') {
            resize();
            animate();
        }
    </script>
</body>
</html>
